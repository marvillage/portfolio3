<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="body"><circle cx="30" cy="35" r="15"/></clipPath>
    <pattern id="dots" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="1.8" cy="1.8" r="1.05" fill="#0a0a0c"/>
    </pattern>
    <!-- hides the half of the ring that passes behind the planet -->
    <mask id="front" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g transform="rotate(-22 30 35)"><rect x="0" y="0" width="64" height="35" fill="#000" clip-path="url(#body)"/></g>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0c"/>
  <!-- comic offset shadow -->
  <circle cx="33" cy="38" r="15" fill="#8c8a84"/>
  <!-- ring, back half -->
  <ellipse cx="30" cy="35" rx="26" ry="7.5" transform="rotate(-22 30 35)" fill="none" stroke="#0a0a0c" stroke-width="7"/>
  <ellipse cx="30" cy="35" rx="26" ry="7.5" transform="rotate(-22 30 35)" fill="none" stroke="#f3f1ea" stroke-width="3.2"/>
  <!-- planet with halftone shade on the lower left -->
  <circle cx="30" cy="35" r="15" fill="#f3f1ea"/>
  <g clip-path="url(#body)">
    <circle cx="22" cy="43" r="15" fill="url(#dots)"/>
    <path d="M17 29 Q30 25 44 31" fill="none" stroke="#0a0a0c" stroke-width="1.6" opacity="0.55"/>
  </g>
  <circle cx="30" cy="35" r="15" fill="none" stroke="#0a0a0c" stroke-width="2.6"/>
  <!-- ring, front half -->
  <g mask="url(#front)">
    <ellipse cx="30" cy="35" rx="26" ry="7.5" transform="rotate(-22 30 35)" fill="none" stroke="#0a0a0c" stroke-width="7"/>
    <ellipse cx="30" cy="35" rx="26" ry="7.5" transform="rotate(-22 30 35)" fill="none" stroke="#f3f1ea" stroke-width="3.2"/>
  </g>
  <!-- four-point sparkle -->
  <path d="M51 6 L53 13.5 L60 15.5 L53 17.5 L51 25 L49 17.5 L42 15.5 L49 13.5 Z" fill="#f3f1ea" stroke="#0a0a0c" stroke-width="1.2"/>
</svg>
